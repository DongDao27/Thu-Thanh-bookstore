name: E2E
on: [push, pull_request]
permissions:
  contents: read
jobs:
  browser:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:17-bookworm
        env:
          POSTGRES_DB: thu_thanh_test
          POSTGRES_USER: thu_thanh_test
          POSTGRES_PASSWORD: ci-isolated-test-only
        ports: ['5432:5432']
        options: >-
          --health-cmd="pg_isready -U thu_thanh_test -d thu_thanh_test"
          --health-interval=5s --health-timeout=5s --health-retries=20
    env:
      APP_ENV: testing
      E2E_TESTING: '1'
      DB_CONNECTION: pgsql
      DB_HOST: 127.0.0.1
      DB_PORT: 5432
      DB_DATABASE: thu_thanh_test
      DB_USERNAME: thu_thanh_test
      DB_PASSWORD: ci-isolated-test-only
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: pdo_pgsql, mbstring, dom, fileinfo
          coverage: none
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: composer install --no-interaction --prefer-dist
        working-directory: backend
      - run: |
          cp backend/.env.testing.example backend/.env.testing
          cd backend
          php artisan key:generate --env=testing
      - run: npm ci
        working-directory: frontend
      - run: npx playwright install --with-deps chromium
        working-directory: frontend
      - run: npm run test:e2e
        working-directory: frontend
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: e2e-report
          path: |
            output/e2e/
            .runtime/e2e-server.log
          retention-days: 7
