name: thu-thanh-staging

x-backend: &backend
  build:
    context: ../backend
    dockerfile: ../deploy/docker/backend.Dockerfile
  image: thu-thanh-backend:local
  env_file: .env.backend
  environment:
    DB_CONNECTION: pgsql
    DB_HOST: db
    DB_PORT: 5432
    DB_DATABASE: thu_thanh
    DB_USERNAME: thu_thanh
    DB_PASSWORD: ${DB_PASSWORD:?Set app database password in deploy/.env}
  volumes:
    - backend-storage:/var/www/html/storage
  depends_on:
    db:
      condition: service_healthy
  restart: unless-stopped
  networks: [database, web]

services:
  db:
    image: postgres:17-bookworm
    environment:
      POSTGRES_DB: thu_thanh
      POSTGRES_USER: thu_thanh
      POSTGRES_PASSWORD: ${DB_PASSWORD:?Set app database password in deploy/.env}
      TZ: UTC
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U thu_thanh -d thu_thanh"]
      interval: 5s
      timeout: 3s
      retries: 30
    restart: unless-stopped
    networks: [database]

  app:
    <<: *backend

  worker:
    <<: *backend
    command: ["php", "artisan", "queue:work", "database", "--sleep=3", "--tries=5", "--timeout=60", "--max-time=3600"]

  scheduler:
    <<: *backend
    command: ["php", "artisan", "schedule:work"]

  web:
    build:
      context: ..
      dockerfile: deploy/docker/nginx.Dockerfile
    ports:
      - "127.0.0.1:8080:80"
    volumes:
      - backend-storage:/var/www/html/storage:ro
    depends_on: [app]
    restart: unless-stopped
    networks: [web]

networks:
  database:
    internal: true
  web:

volumes:
  postgres-data:
  backend-storage:
