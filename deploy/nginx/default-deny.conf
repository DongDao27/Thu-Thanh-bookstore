# Enable instead of Ubuntu's default welcome site, alongside the named API sites.
# Unknown hosts and raw-IP requests must not expose the default server page/version.
server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name _;
    server_tokens off;
    return 404;
}

server {
    listen 443 ssl default_server;
    listen [::]:443 ssl default_server;
    server_name _;
    ssl_reject_handshake on;
    server_tokens off;
}
