# D105: API-only VPS. Configure certificates/firewall before enabling this file.
# Define log_format thu_thanh_safe in http{} without query strings (see DEPLOYMENT).
server {
    listen 80;
    server_name api.books.example.com;
    return 301 https://api.books.example.com$request_uri;
}
server {
    listen 443 ssl;
    server_name api.books.example.com;
    root /srv/thu-thanh/current/backend/public;
    index index.php;
    ssl_certificate /etc/ssl/thu-thanh/origin.pem;
    ssl_certificate_key /etc/ssl/thu-thanh/origin.key;
    ssl_protocols TLSv1.2 TLSv1.3;
    # Enable zone-specific AOP in Cloudflare and provision its CA first.
    ssl_client_certificate /etc/ssl/thu-thanh/origin-pull-ca.pem;
    ssl_verify_client on;
    client_max_body_size 8m;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy no-referrer always;
    access_log /var/log/nginx/thu-thanh-access.log thu_thanh_safe;

    location / { try_files $uri $uri/ /index.php?$query_string; }
    location ^~ /storage/ {
        # ^~ prevents uploaded extensions from reaching any executable handler.
        alias /srv/thu-thanh/shared/backend/storage/app/public/;
        autoindex off;
        types { image/jpeg jpg jpeg; image/png png; image/webp webp; }
        default_type application/octet-stream;
        add_header X-Content-Type-Options nosniff always;
    }
    location = /index.php {
        internal;
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME $realpath_root/index.php;
        fastcgi_param DOCUMENT_ROOT $realpath_root;
        fastcgi_param HTTPS on;
        # Trust only CF-Connecting-IP from Cloudflare, enforced by firewall + AOP.
        # Do not pass attacker-controlled forwarded chains to Laravel.
        fastcgi_param REMOTE_ADDR $http_cf_connecting_ip;
        fastcgi_param HTTP_X_FORWARDED_FOR "";
        fastcgi_param HTTP_X_FORWARDED_HOST "";
        fastcgi_param HTTP_X_FORWARDED_PROTO "";
        fastcgi_pass unix:/run/php/php8.4-fpm.sock;
    }
    location ~ \.php$ { return 404; }
    location ~ /\. { deny all; }
}
